# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        # NOT_CRAN=false on every job: the strict bit-identicality gates are a
        # local regression detector, not a CI gate. Exact FP equality between
        # the R reference and the C++ core is a property of one toolchain, not
        # of the algorithm — it holds on Windows R 4.5.3 and fails elsewhere
        # for reasons that have nothing to do with correctness (R's `^` uses
        # repeated multiplication for integer exponents while kernel_poly_cpp
        # uses `powl`; macOS aarch64 has a 64-bit long double). The tolerance
        # tier runs unconditionally and is what verifies correctness in CI.
        # See tests/testthat/helper-fp-tiers.R.
        #
        # This must be pinned HERE, and it must be pinned explicitly. setup-r@v2
        # exports NOT_CRAN=true to GITHUB_ENV (alongside R_LIBS_USER, TZ and
        # _R_CHECK_SYSTEM_CLOCK_), and GITHUB_ENV overrides job-level env for
        # every subsequent step. Deleting this block does not leave NOT_CRAN
        # unset — it lets setup-r's `true` through and turns the strict gates
        # on for all five jobs. Step-level env outranks GITHUB_ENV.
        env:
          NOT_CRAN: 'false'
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

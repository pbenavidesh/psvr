# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:

name: R-CMD-check.yaml

permissions: read-all

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}

    name: ${{ matrix.config.os }} (${{ matrix.config.r }})

    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          # The one job that runs the strict bit-identicality gates. Those
          # assert exact FP equality between the R and C++ paths, which holds
          # only within a single toolchain (macOS aarch64 has a 64-bit long
          # double; the polynomial kernel differs 1-2 ULP everywhere). They
          # sit behind skip_on_cran(), so NOT_CRAN=true is what turns them on
          # here and leaves them skipped on the other four jobs. See
          # tests/testthat/helper-fp-tiers.R.
          - {os: ubuntu-latest,   r: 'release', not-cran: 'true'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        # NOT_CRAN has to be pinned HERE, not at job level. setup-r@v2 exports
        # NOT_CRAN=true to GITHUB_ENV (alongside R_LIBS_USER, TZ and
        # _R_CHECK_SYSTEM_CLOCK_), and GITHUB_ENV overrides job-level env for
        # every subsequent step — so a job-level value is silently discarded.
        # Step-level env outranks GITHUB_ENV, which makes this the only place
        # the value survives. check-r-package itself does not set NOT_CRAN.
        #
        # 'true' on ubuntu-latest (release) runs the strict bit-identicality
        # gates on x86_64; 'false' everywhere else leaves them skipped, since
        # they only hold within a single toolchain. See helper-fp-tiers.R.
        env:
          NOT_CRAN: ${{ matrix.config.not-cran || 'false' }}
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'

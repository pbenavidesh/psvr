# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown.yaml

permissions: read-all

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    # Only restrict concurrency for non-PR jobs
    concurrency:
      group: pkgdown-${{ github.event_name != 'pull_request' || github.run_id }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: quarto-dev/quarto-actions/setup@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::quarto, local::.
          needs: website

      # pkgdown renders every root-level .md that is not on its own hard-coded
      # exclusion list (pkgdown:::package_mds) and offers no per-file opt-out,
      # so the only way to keep CLAUDE.md off the published site is to keep it
      # out of the build input. This checkout is disposable and CLAUDE.md is in
      # .Rbuildignore, so nothing else in this job needs it; the tracked file in
      # the repository is untouched.
      #
      # Removing it here rather than deleting docs/CLAUDE.html after the build
      # is deliberate. A post-build delete would leave the page listed in
      # sitemap.xml and its full text embedded in search.json, both of which are
      # derived from the pages that were built. See PSVR_STATUS.md section 2.8.
      - name: Keep CLAUDE.md out of the pkgdown build
        run: rm -f CLAUDE.md
        shell: bash

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Deploy to GitHub pages 🚀
        if: github.event_name != 'pull_request'
        uses: JamesIves/github-pages-deploy-action@v4.5.0
        with:
          clean: true
          branch: gh-pages
          folder: docs

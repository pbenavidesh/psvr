url: https://pbenavidesh.github.io/psvr/

template:
  bootstrap: 5
  bootswatch: cosmo

home:
  title: "psvr — Percentage-Error SVR"
  description: >
    Four support vector regression models derived from a unified
    percentage-error loss framework (MAPE and RMSPE), with optional
    symmetric kernel extensions and tidymodels integration.

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: "Get Started"
      href: articles/getting-started.html
    github:
      icon: fab fa-github
      href: https://github.com/pbenavidesh/psvr
      aria-label: GitHub

reference:
  - title: "Model fitting"
    desc: >
      One fitter per model family. `psvr_mape()` covers the epsilon-SVR
      models (1 and 2), `psvr_rmspe()` the LS-SVR models (3 and 4); within
      each, `sym_type = "none" | "even" | "odd"` selects the symmetric
      variant. They are separate functions because the two families share no
      solver, no dual structure and no hyperparameter search space.
    contents:
      - psvr_mape
      - psvr_rmspe

  - title: "Kernel factory"
    desc: "Shared kernel interface used by all four models."
    contents:
      - make_kernel

  - title: "Cross-validation"
    desc: >
      Fold-wise fitting for `loss = "mape"`, carrying the converged SMO
      dual variables from one fold into the next as a warm start.
    contents:
      - psvr_cv

  - title: "tidymodels / parsnip interface — ε-SVR with MAPE (Models 1 & 2)"
    desc: >
      Parsnip model specifications for the ε-SVR family (one per kernel type).
      `sym_type = "none"` fits Model 1; `"even"` / `"odd"` fit Model 2.
    contents:
      - psvr_mape_specs

  - title: "tidymodels / parsnip interface — LS-SVR with RMSPE (Models 3 & 4)"
    desc: >
      Parsnip model specifications for the LS-SVR family (one per kernel type).
      `sym_type = "none"` fits Model 3; `"even"` / `"odd"` fit Model 4.
    contents:
      - psvr_rmspe_specs

  - title: "Hyperparameter utilities"
    desc: "Custom dials parameters and tuning helpers for psvr models."
    contents:
      - margin_percentage
      - sigma_heuristic
      - rbf_sigma_psvr
      - rbf_sigma_psvr_data
      - psvr_option_add
      - psvr_option_add_cost_ls
      - cost_psvr
      - cost_psvr_ls_data
      - sym_type_param

  - title: "Fit-object methods"
    desc: >
      Methods for the four fit classes — `psvr_mape`, `psvr_mape_sym`,
      `psvr_rmspe`, `psvr_rmspe_sym`. These are what `psvr_mape()` and
      `psvr_rmspe()` return **and** what the parsnip engine fit wrappers
      return, so a direct fit and a parsnip fit unwrapped with
      `parsnip::extract_fit_engine()` are the same object.
    contents:
      - predict.psvr_mape
      - predict.psvr_mape_sym
      - predict.psvr_rmspe
      - predict.psvr_rmspe_sym
      - print.psvr_mape
      - print.psvr_mape_sym
      - print.psvr_rmspe
      - print.psvr_rmspe_sym
      - coef.psvr_mape
      - coef.psvr_mape_sym
      - coef.psvr_rmspe
      - coef.psvr_rmspe_sym
      - summary.psvr_mape
      - summary.psvr_mape_sym
      - summary.psvr_rmspe
      - summary.psvr_rmspe_sym
      - psvr-fitted
      - psvr-residuals

articles:
  - title: ~
    navbar: ~
    contents:
      - getting-started

  - title: "Workflows"
    navbar: "Workflows"
    contents:
      - tidymodels-workflow

  - title: "Technical Notes"
    navbar: "Technical Notes"
    contents:
      - articles/when-to-use-psvr

news:
  one_page_per_version: true
